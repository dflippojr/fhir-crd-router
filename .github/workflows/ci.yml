name: CI

# One workflow so that one check, `gate`, can be required: it passes only when
# the build matrix, the SonarCloud analysis, the FHIR validator, the CRD
# reference server tests, the corpus edit check and the gate guard all pass.
# The ruleset also requires `gate-guard`, the trusted copy of the guard that
# gate-guard-target.yml posts from master (DECISIONS.md, "Gate guard").
on:
  push:
    branches: [main, master]
  pull_request:
    types: [opened, synchronize, reopened]

# A new push to a PR cancels that PR's older run. Runs on master are never
# cancelled: each commit gets its own group, so every master commit is built
# and analyzed.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  build:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      # Keep Linux quickstart proof even when another platform exposes a bug.
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        java: ['17', '21']
        include:
          - os: windows-latest
            java: '21'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - run: chmod +x mvnw
        if: runner.os == 'Linux'
      - run: ./mvnw -B -ntp verify
        if: runner.os == 'Linux'
      - run: .\mvnw.cmd -B -ntp verify
        if: runner.os == 'Windows'
      - name: Run the documented quickstart and check its output
        if: runner.os == 'Linux' && matrix.java == '21'
        shell: bash
        run: bash .github/scripts/quickstart-smoke.sh

  # SonarCloud is free for this public repo. Automatic analysis is turned off in
  # SonarCloud; this job is the analysis, so coverage (JaCoCo, one XML report
  # per module) is included. sonar.qualitygate.wait fails the job when the
  # quality gate fails. Org/project keys live in the parent pom.
  sonar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    # Secrets are not passed to pull requests from forks; skip rather than fail.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Check analysis token
        id: token
        env:
          # GitHub supplies the same name from the Dependabot secret store on
          # Dependabot PRs, and the Actions secret store on other runs.
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          DEPENDABOT_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]' }}
        shell: bash
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          elif [ "$DEPENDABOT_PR" = "true" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SonarCloud analysis skipped: repository Dependabot secret SONAR_TOKEN is not configured."
            echo "SonarCloud analysis was skipped because the repository Dependabot secret SONAR_TOKEN is missing. This run did not publish analysis or evaluate the quality gate. Add the secret and synchronize the PR to run analysis." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::SONAR_TOKEN is required for SonarCloud analysis. Configure the repository Actions secret."
            exit 1
          fi
      - uses: actions/checkout@v7
        if: steps.token.outputs.available == 'true'
        with:
          # Full history so SonarCloud can blame lines and find the PR base.
          fetch-depth: 0
      - uses: actions/setup-java@v6
        if: steps.token.outputs.available == 'true'
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: chmod +x mvnw
        if: steps.token.outputs.available == 'true'
      - name: Build, test and analyze
        if: steps.token.outputs.available == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./mvnw -B -ntp verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.qualitygate.wait=true

  # The official HL7 FHIR validator as an outside judge of the hand-written
  # CoverageInformationValidator (#96). It validates the coverage-information
  # corpus and the FHIR resources in the test fixtures against CRD 2.2.1, then
  # fails if a recorded verdict changed. The pinned validator version and its
  # SHA-256 live in fhir-validator/run.sh, so a change there misses the cache.
  fhir-validator:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/fhir-validator
            ~/.fhir/packages
          key: fhir-validator-${{ hashFiles('fhir-validator/run.sh') }}
      - run: bash fhir-validator/run.sh
      - name: Fail if an official verdict changed
        shell: bash
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            git diff
            echo "::error::The official validator's verdicts changed. Run fhir-validator/run.sh, review the diff, and fix the validator or record the difference (client-sdk/src/test/resources/coverage-information/README.md)."
            exit 1
          fi

  # The HL7 Da Vinci CRD reference implementation: the one judge here this
  # repo's author did not write. It is built from the commit pinned in
  # .github/crd-ri.ref, so a red run means our change broke interop, not that
  # the RI moved (crd-reference-server.yml watches RI master for that). The
  # image is cached by that commit; a new pin builds it once (several minutes).
  crd-ri:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Read pinned reference server commit
        id: ref
        run: echo "sha=$(tr -d '[:space:]' < .github/crd-ri.ref)" >> "$GITHUB_OUTPUT"
      - name: Restore reference server image
        id: image
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/crd-ri.tar
          key: crd-ri-image-${{ steps.ref.outputs.sha }}
      - name: Build reference server image
        if: steps.image.outputs.cache-hit != 'true'
        env:
          SHA: ${{ steps.ref.outputs.sha }}
        run: |
          docker build -t crd-ri "https://github.com/HL7-DaVinci/CRD.git#$SHA"
          docker save crd-ri -o "$RUNNER_TEMP/crd-ri.tar"
      - name: Load cached reference server image
        if: steps.image.outputs.cache-hit == 'true'
        run: docker load -i "$RUNNER_TEMP/crd-ri.tar"
      - name: Start reference server
        run: |
          docker run -d --name crd-ri -p 18090:8090 crd-ri
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:18090/r4/cds-services > /dev/null && exit 0
            sleep 5
          done
          docker logs crd-ri | tail -50
          exit 1
      - run: chmod +x mvnw
      - name: Run tests against it
        env:
          CRD_RI_BASE_URL: http://127.0.0.1:18090/r4
        run: ./mvnw -B -ntp -pl client-sdk -am test
      - name: Require the reference server tests to have run
        # CrdReferenceServerTest is skipped without CRD_RI_BASE_URL; a skip here is a failure.
        run: |
          report=client-sdk/target/surefire-reports/TEST-io.github.dflippojr.fhircrdrouter.client.crd.CrdReferenceServerTest.xml
          test -f "$report" || { echo "::error::$report not found"; exit 1; }
          grep -o '<testsuite [^>]*>' "$report"
          if grep -q 'skipped="[1-9]' "$report" || grep -q '<skipped' "$report"; then
            echo "::error::CrdReferenceServerTest skipped tests against the reference server"
            exit 1
          fi
      - name: Reference server log
        if: failure()
        run: docker logs crd-ri 2>&1 | tail -200

  # Never edit a corpus case to make it agree (AGENTS.md, step 3; #131). Fails
  # a pull request that modifies, renames or deletes a file under
  # coverage-information/cases/ or crd-ri/ unless it also changes
  # known-differences.json or DECISIONS.md. The check and its test run from
  # the base commit, checked out apart from the pull request, which is only
  # the repository they inspect: a pull request that edits the scripts can't
  # weaken the check on itself (DECISIONS.md, "Corpus edit check"). The test
  # step runs the check in throwaway repos. Pull requests only: gate accepts
  # it skipped on a push.
  corpus-edit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: github.event_name == 'pull_request'
    steps:
      - name: Check out the pull request (data only, nothing from it runs)
        uses: actions/checkout@v7
        with:
          path: pr
          # History of the base branch too, to find the merge base.
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the base commit (the check that runs)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - name: Choose the check
        id: check
        shell: bash
        run: |
          if [ -f trusted/.github/scripts/corpus-edit-check.sh ]; then
            echo "dir=$GITHUB_WORKSPACE/trusted/.github/scripts" >> "$GITHUB_OUTPUT"
          else
            # Only a base older than the check itself (#131) gets here. The
            # check refuses a pull request that deletes or renames it, so
            # master can't get back here.
            echo "::warning::the base commit has no corpus-edit-check.sh; running the pull request's copy"
            echo "dir=$GITHUB_WORKSPACE/pr/.github/scripts" >> "$GITHUB_OUTPUT"
          fi
      - name: Test the check
        env:
          CHECK_DIR: ${{ steps.check.outputs.dir }}
        run: bash "$CHECK_DIR/corpus-edit-check-test.sh"
      - name: Check this pull request's corpus edits
        working-directory: pr
        env:
          BASE_REF: ${{ github.base_ref }}
          CHECK_DIR: ${{ steps.check.outputs.dir }}
        run: bash "$CHECK_DIR/corpus-edit-check.sh" "origin/$BASE_REF"

  # The shared gate guard (dflippojr/.github), called at a full commit SHA that
  # dflippojr/.github main contains; guard-ref names the same SHA, so the script
  # that judges the pull request is the one that was reviewed. It fails a pull
  # request that deletes tests, adds @Disabled, adds retries, or edits
  # workflows, Sonar or JaCoCo config, unless the owner applied
  # gate-change-approved. It checks pull requests only (a push prints a
  # notice). Labels are read when the job runs: after the owner applies one,
  # re-run this job. This job is an early signal inside gate, not the judge: a
  # pull request can replace it, and it accepts a label applied before the
  # newest push. The gate-guard check from gate-guard-target.yml is the one the
  # ruleset trusts.
  gate-guard:
    permissions:
      contents: read
      issues: read
      pull-requests: read
    uses: dflippojr/.github/.github/workflows/gate-guard.yml@27bdb76481888567a6c524ebbb19bf4a6c7e7e20
    with:
      guard-ref: 27bdb76481888567a6c524ebbb19bf4a6c7e7e20
      require-owner-label-actor: true

  # The single check to require. It runs even when a needed job fails or is
  # cancelled, and fails unless every needed job succeeded. The allowed
  # exceptions are `sonar` skipped on a fork PR, which gets no secrets, and
  # `corpus-edit` skipped on a push, which has no base to compare with.
  gate:
    runs-on: ubuntu-latest
    permissions: {}
    needs: [build, sonar, fhir-validator, crd-ri, corpus-edit, gate-guard]
    if: always()
    steps:
      - name: Require every needed job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
          FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          EVENT: ${{ github.event_name }}
        shell: bash
        run: |
          failed=0
          while read -r job result; do
            if [ "$result" = "success" ]; then
              echo "$job: success"
            elif [ "$job" = "sonar" ] && [ "$result" = "skipped" ] && [ "$FORK_PR" = "true" ]; then
              echo "::notice::$job: skipped on a fork PR (no secrets)"
            elif [ "$job" = "corpus-edit" ] && [ "$result" = "skipped" ] && [ "$EVENT" != "pull_request" ]; then
              echo "::notice::$job: skipped on a push (pull requests only)"
            else
              echo "::error::$job: $result"
              failed=1
            fi
          done < <(jq -r 'to_entries[] | "\(.key) \(.value.result)"' <<< "$NEEDS")
          exit "$failed"
