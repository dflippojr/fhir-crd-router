# jqwik property tests. Each property fixes its seed in @Property(seed = ...), so every run, in CI
# or locally, generates the same samples; a failure report prints the seed and the shrunk sample.
jqwik.tries.default = 1000
# Rerun a failed property from its seed, not from a stored sample, so a run never depends on history.
jqwik.failures.after.default = PREVIOUS_SEED
# Keep jqwik's failure database out of the source tree.
jqwik.database = target/jqwik-database
jqwik.reporting.onlyfailures = true
